[project]
name = "blockchain-mini-voting"
version = "0.0.1"
description = "Four-validator permissioned blockchain coursework scaffold"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
