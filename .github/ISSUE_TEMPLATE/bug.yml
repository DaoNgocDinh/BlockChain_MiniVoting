name: Báo lỗi
description: Lỗi tái hiện được trong node, giao diện hoặc script.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Cách tái hiện
      description: Commit SHA, cấu hình, seed, các bước và log đã bỏ bí mật.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và thực tế
    validations:
      required: true
